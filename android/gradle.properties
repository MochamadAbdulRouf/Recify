# Disetel untuk PC 7GB RAM (Ryzen 3 7320U, Windows 11).
# Nilai lama -Xmx8G -XX:MaxMetaspaceSize=4G MELEBIHI RAM fisik →
# daemon JVM crash (OutOfMemoryError / daemon disappeared) saat assembleDebug.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kecepatan build di RAM terbatas: cache + paralel aman untuk project single-module.
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
