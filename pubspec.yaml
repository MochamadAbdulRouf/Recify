name: recify
description: "Recify - Smart Receipt Scanner & Dark-Mode Offline Personal Finance App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Local SQLite Database & Storage
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # On-Device OCR & Image Handling
  google_mlkit_text_recognition: ^0.14.0
  image_picker: ^1.1.2

  # Formatters & Charts
  intl: ^0.19.0
  fl_chart: ^0.70.2
  uuid: ^4.5.1

  # Fonts & Icons
  google_fonts: ^6.2.1

  # Local Export
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
